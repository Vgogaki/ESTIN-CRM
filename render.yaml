# Render "Blueprint": describes the whole REVIEW copy of the system so it can be
# created in one go. Not production — see docs/hosting-review.md for the full
# walkthrough and for what a real launch still needs.
#
# Secrets are never written here. Render generates the random ones itself
# (generateValue) and shows them only on the service's Environment page, so no
# password ever passes through chat, email or the code repository.

databases:
  - name: estin-review-db
    region: frankfurt          # EU only (GDPR, CLAUDE.md hosting rule)
    plan: basic-256mb
    databaseName: estin_crm
    user: estin
    ipAllowList: []            # no access from the internet at all; only the app, over Render's private network

services:
  - type: web
    name: estin-crm-review
    runtime: docker
    region: frankfurt          # same EU region as the database
    plan: starter              # always on (the free tier goes to sleep)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: estin-review-db
          property: connectionString

      # Fresh secrets, generated by Render. Never the ones from the founder's laptop.
      - key: AUTH_SECRET
        generateValue: true
      - key: ORDERS_API_KEY
        generateValue: true
      - key: KYC_ENCRYPTION_KEY
        generateValue: true

      # Password gate in front of the whole site (src/server/review-gate.ts).
      # Fails closed: if the password were ever missing, the site refuses everything.
      - key: REVIEW_GATE
        value: "on"
      - key: REVIEW_GATE_USER
        value: reviewer
      - key: REVIEW_GATE_PASSWORD
        generateValue: true

      # Admin accounts + obviously-fake demo data (docker-entrypoint.sh). The demo
      # seed refuses to run if a real person ever exists in this database.
      - key: RUN_SEED
        value: "on"
      - key: ALLOW_DEMO_SEED
        value: "yes"
      - key: SEED_FOUNDER_PASSWORD
        generateValue: true
      - key: SEED_COFOUNDER_PASSWORD
        generateValue: true
      - key: SEED_COFOUNDER_EMAIL
        sync: false            # Render asks for this when the Blueprint is created

      # Uploaded files (KYC documents, support attachments) are kept encrypted but
      # on temporary storage here: they vanish when the service restarts. Fine for
      # a review with demo data; production needs real object storage.
      - key: KYC_STORAGE_DIR
        value: /tmp/kyc-storage

      # No EMAIL_DRIVER: emails are recorded (Back office > Email) and never delivered.
